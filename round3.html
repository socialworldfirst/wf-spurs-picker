<html lang="en">

<title>WF × Spurs 26/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --navy:#000A3C; --navy-d:#000532; --off:#F5F5FA; --silver:#D7D7DC;
  --yellow:#FFE100; --rose:#FF0051;
  --ink:#15161a; --ink-2:#5b5f68; --hair:#e3e3e6;
  --display:"Poppins","Helvetica Neue",Arial,sans-serif;
  --sans:"Poppins","Helvetica Neue",Arial,sans-serif;
  --club:"Outfit","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#fbfbfc;color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}

.wrap{max-width:1360px;margin:0 auto;padding:0 40px}
header.top{padding:88px 0 40px;border-bottom:1px solid var(--hair)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin:0 0 22px}
h1.title{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.08;letter-spacing:-.03em;margin:0 0 18px;max-width:20ch}
p.standfirst{font-size:19px;line-height:1.6;color:var(--ink-2);max-width:64ch;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:28px;margin-top:32px;font-size:13px;color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:600}

.rails{padding:36px 0 8px;border-bottom:1px solid var(--hair)}
.rails h2{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin:0 0 20px}
.railgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--hair)}
.rail{padding:22px 26px 26px 0;border-right:1px solid var(--hair)}
.rail:last-child{border-right:0}
.rail h3{font-size:14px;font-weight:600;margin:0 0 8px}
.rail p{font-size:13.5px;line-height:1.55;color:var(--ink-2);margin:0}

main{padding:56px 0 0}
.board{padding:0 0 76px;margin:0 0 76px;border-bottom:1px solid var(--hair);display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:56px;align-items:start}
.board:last-child{border-bottom:0}
.numline{display:flex;align-items:baseline;gap:16px;margin:0 0 14px}
.num{font-family:var(--display);font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}
.kind{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
h2.cname{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.16;letter-spacing:-.02em;margin:0 0 16px}
.line{font-size:20px;line-height:1.45;margin:0 0 24px}
.line span{color:var(--ink-2)}
dl.facts{margin:0;border-top:1px solid var(--hair)}
dl.facts div{display:grid;grid-template-columns:118px 1fr;gap:20px;padding:13px 0;border-bottom:1px solid var(--hair)}
dl.facts dt{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);padding-top:3px}
dl.facts dd{margin:0;font-size:14.5px;line-height:1.6}

footer.foot{padding:64px 0 120px;border-top:1px solid var(--hair);margin-top:24px}
footer.foot h2{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 24px}
.footgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:44px}
.footgrid h3{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px}
.footgrid ul{margin:0;padding-left:18px}
.footgrid li{font-size:14px;line-height:1.7;margin-bottom:8px}

/* ---------- artboards ---------- */
.frame{width:100%;aspect-ratio:1080/1350;position:relative;overflow:hidden;background:var(--navy);
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 18px 44px -18px rgba(0,10,60,.30)}
.art{position:absolute;top:0;left:0;width:1080px;height:1350px;transform-origin:top left;transform:scale(var(--s,.5));overflow:hidden}
.plate{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;display:block}
.cap{margin-top:12px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

.scrim-b{position:absolute;left:0;right:0;bottom:0;height:640px;
  background:linear-gradient(180deg,rgba(0,5,50,0) 0%,rgba(0,5,50,.62) 46%,rgba(0,5,50,.93) 100%)}
.scrim-t{position:absolute;left:0;right:0;top:0;height:640px;
  background:linear-gradient(0deg,rgba(0,5,50,0) 0%,rgba(0,5,50,.62) 46%,rgba(0,5,50,.93) 100%)}
.scrim-foot{position:absolute;left:0;right:0;bottom:0;height:340px;
  background:linear-gradient(180deg,rgba(0,5,50,0),rgba(0,5,50,.55) 45%,rgba(0,5,50,.92))}
.scrim-light{position:absolute;left:0;right:0;bottom:0;height:330px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.88) 52%,#fff 100%)}

.copy{position:absolute;left:84px;right:84px;color:#fff}
.copy.at-top{top:96px}
.copy.at-bot{bottom:250px}
.copy.on-light{color:var(--navy)}
h3.hl{font-family:var(--display);font-weight:800;font-size:66px;line-height:.94;letter-spacing:-.03em;margin:0}
p.sl{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.35;margin:26px 0 0;opacity:.78}
p.tag{font-family:var(--sans);font-size:18px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin:0 0 30px;color:var(--rose)}
p.tag.gold{color:var(--yellow)}

.lockwrap{position:absolute;left:0;right:0;bottom:92px;color:#fff}
.lockwrap.on-light{color:var(--navy)}
.lockup{display:flex;align-items:center;justify-content:center}
.crest{width:84px;height:107px;border:1.5px dashed currentColor;opacity:.85;display:flex;align-items:center;justify-content:center;
  font-family:var(--club);font-size:10px;font-weight:600;letter-spacing:.1em;text-align:center;line-height:1.25;text-transform:uppercase}
.gap{width:27px}
.vr{width:1.5px;height:74px;background:currentColor;opacity:.35}
.wfmark{width:190px;height:26px;display:block}
.wfmark use{fill:currentColor}
.desig{font-family:var(--club);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin:15px 0 0;opacity:.9}
.desig em{font-style:normal;opacity:.5}

@media (max-width:1080px){
  .board{grid-template-columns:1fr;gap:30px}
  .railgrid{grid-template-columns:1fr 1fr}
  .rail{border-right:0;border-bottom:1px solid var(--hair)}
  .footgrid{grid-template-columns:1fr}
  h1.title{font-size:38px}
  .wrap{padding:0 22px}
}
</style>

<style>
:root{--gate-ink:#111;--gate-mute:#8a8a8a;--gate-line:#e5e5e5;--gate-bg:#fff}

#gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;
justify-content:center;background:var(--gate-bg);
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
#gate-card{width:min(320px,86vw);text-align:left}
#gate-card h2{font-size:15px;font-weight:600;letter-spacing:-.01em;
color:var(--gate-ink);margin:0 0 4px}
#gate-card p{font-size:12px;color:var(--gate-mute);margin:0 0 20px;line-height:1.5}
#gate-form{display:flex;gap:8px}
#gate-input{flex:1;padding:9px 11px;font-size:13px;color:var(--gate-ink);

#gate-input:focus{border-color:var(--gate-ink)}
#gate-btn{padding:9px 15px;font-size:13px;border:1px solid var(--gate-ink);
border-radius:6px;background:var(--gate-ink);color:var(--gate-bg);cursor:pointer}
#gate-err{min-height:16px;margin-top:9px;font-size:12px;color:#c0392b}
#gate-foot{margin-top:22px;font-size:11px;color:var(--gate-mute)}
.gate-lock{position:fixed;right:12px;bottom:10px;z-index:9998;font:11px
-apple-system,BlinkMacSystemFont,sans-serif;color:#9a9a9a;cursor:pointer;
opacity:.55;text-decoration:underline}
.gate-lock:hover{opacity:1}
</style>

<script>
(function(){
  var KEY='gate:'+location.pathname;
  function b2b(b64){var s=atob(b64),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
  async function derive(pw,salt,it){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
      'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,
      hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function decrypt(pw){
    var b=JSON.parse(document.getElementById('gate-payload').textContent);
    var k=await derive(pw,b2b(b.salt),b.iterations);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2b(b.iv)},k,
      b2b(b.ciphertext));
    return new TextDecoder().decode(plain);
  }
  function runScripts(root){
    root.querySelectorAll('script').forEach(function(old){
      var s=document.createElement('script');
      for(var i=0;i<old.attributes.length;i++){
        s.setAttribute(old.attributes[i].name,old.attributes[i].value);
      }
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  }
  function reveal(html){
    var c=document.getElementById('gate-content');
    c.innerHTML=html; c.hidden=false;
    var g=document.getElementById('gate'); if(g) g.remove();
    document.body.classList.remove('gate-locked');
    runScripts(c);
    var lock=document.createElement('div');
    lock.className='gate-lock'; lock.textContent='lock device';
    lock.onclick=function(){localStorage.removeItem(KEY);location.reload();};
    document.body.appendChild(lock);
    window.dispatchEvent(new Event('gate:unlocked'));
    try{window.dispatchEvent(new Event('resize'));}catch(e){}
  }
  window.gateSubmit=async function(e){
    e.preventDefault();
    var inp=document.getElementById('gate-input');
    var err=document.getElementById('gate-err');
    err.textContent='';
    try{
      var html=await decrypt(inp.value);
      localStorage.setItem(KEY,inp.value);
      reveal(html);
    }catch(_){ err.textContent='Wrong password.'; inp.select(); }
    return false;
  };
  document.addEventListener('DOMContentLoaded',async function(){
    var saved=localStorage.getItem(KEY);
    if(!saved) return;
    try{ reveal(await decrypt(saved)); }
    catch(_){ localStorage.removeItem(KEY); }
  });
})();
</script>
